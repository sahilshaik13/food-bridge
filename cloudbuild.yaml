# Cloud Build configuration for FoodBridge Backend
# Triggers on push to main branch
steps:
  # Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/foodbridge-api:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/foodbridge-api:latest"
      - "./backend"

  # Push to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/foodbridge-api:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/foodbridge-api:latest"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "foodbridge-api"
      - "--image"
      - "gcr.io/$PROJECT_ID/foodbridge-api:$COMMIT_SHA"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--set-env-vars"
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GCP_REGION=asia-south1,GCP_LOCATION=asia-south1"
      - "--set-secrets"
      - "FIREBASE_ADMIN_CREDENTIALS=FIREBASE_ADMIN_CREDENTIALS:latest,GOOGLE_APPLICATION_CREDENTIALS=GOOGLE_APPLICATION_CREDENTIALS:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest"

images:
  - "gcr.io/$PROJECT_ID/foodbridge-api:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/foodbridge-api:latest"

timeout: "1200s"
